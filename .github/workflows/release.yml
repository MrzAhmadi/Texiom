name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  packages:
    name: Build packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: ver
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -q
          sudo apt-get install -q -y nfpm

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build .deb
        run: nfpm pkg --config packaging/nfpm.yaml --packager deb --target dist/
        env:
          TEXBUILD_VERSION: ${{ steps.ver.outputs.value }}

      - name: Build .rpm
        run: nfpm pkg --config packaging/nfpm.yaml --packager rpm --target dist/
        env:
          TEXBUILD_VERSION: ${{ steps.ver.outputs.value }}

      - name: Build .tar.gz
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          DIR="texbuild-${VERSION}"
          mkdir -p "${DIR}/.devcontainer"
          cp texbuild "${DIR}/texbuild"
          cp .devcontainer/Dockerfile "${DIR}/.devcontainer/Dockerfile"
          cp VERSION "${DIR}/VERSION"
          cp README.md "${DIR}/"
          cp packaging/install.sh "${DIR}/install.sh"
          chmod +x "${DIR}/texbuild" "${DIR}/install.sh"
          tar -czf "dist/texbuild-${VERSION}-linux.tar.gz" "${DIR}/"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: packages
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Remove existing release/tag for this version, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${VERSION}" --yes --cleanup-tag || true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/texbuild_*.deb
            dist/texbuild-*.rpm
            dist/texbuild-*.tar.gz
