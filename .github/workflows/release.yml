name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/run.sh

  packages:
    name: Build packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from VERSION file
        id: ver
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -q
          sudo apt-get install -q -y nfpm

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build .deb
        run: nfpm pkg --config packaging/nfpm.yaml --packager deb --target dist/
        env:
          TEXIOM_VERSION: ${{ steps.ver.outputs.value }}

      - name: Build .rpm
        run: nfpm pkg --config packaging/nfpm.yaml --packager rpm --target dist/
        env:
          TEXIOM_VERSION: ${{ steps.ver.outputs.value }}

      - name: Build .tar.gz
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          DIR="texiom-${VERSION}"
          mkdir -p "${DIR}"
          cp texiom "${DIR}/texiom"
          cp -r docker "${DIR}/docker"
          cp -r lib "${DIR}/lib"
          cp -r packaging/completions "${DIR}/completions"
          cp VERSION "${DIR}/VERSION"
          cp README.md "${DIR}/"
          cp packaging/install.sh "${DIR}/install.sh"
          chmod +x "${DIR}/texiom" "${DIR}/install.sh"
          tar -czf "dist/texiom-${VERSION}-linux.tar.gz" "${DIR}/"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  image-slim:
    name: Slim image (default)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-image
        with:
          target: slim
          version: ${{ steps.ver.outputs.value }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/mrzahmadi/texiom:slim
            ghcr.io/mrzahmadi/texiom:${{ steps.ver.outputs.value }}-slim

  # Not on the release's critical path: the Action and Dev Container use this image,
  # the CLI does not. Cached layers keep it quick unless the package lists change.
  image-full:
    name: Full image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-image
        with:
          target: full
          version: ${{ steps.ver.outputs.value }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/mrzahmadi/texiom:latest
            ghcr.io/mrzahmadi/texiom:full
            ghcr.io/mrzahmadi/texiom:${{ steps.ver.outputs.value }}

  release:
    name: Create GitHub Release
    needs: [test, packages, image-slim]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist/

      - name: Remove existing release/tag for this version, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${VERSION}" --yes --cleanup-tag || true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/texiom_*.deb
            dist/texiom-*.rpm
            dist/texiom-*.tar.gz
