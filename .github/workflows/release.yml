name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  packages:
    name: Build packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: ver
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -q
          sudo apt-get install -q -y nfpm

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build .deb
        run: nfpm pkg --config packaging/nfpm.yaml --packager deb --target dist/
        env:
          LATEXBUILD_VERSION: ${{ steps.ver.outputs.value }}

      - name: Build .rpm
        run: nfpm pkg --config packaging/nfpm.yaml --packager rpm --target dist/
        env:
          LATEXBUILD_VERSION: ${{ steps.ver.outputs.value }}

      - name: Build .tar.gz
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          DIR="latexbuild-${VERSION}"
          mkdir -p "${DIR}"
          cp latexbuild "${DIR}/latexbuild"
          cp -r docker "${DIR}/docker"
          cp -r packaging/completions "${DIR}/completions"
          cp VERSION "${DIR}/VERSION"
          cp README.md "${DIR}/"
          cp packaging/install.sh "${DIR}/install.sh"
          chmod +x "${DIR}/latexbuild" "${DIR}/install.sh"
          tar -czf "dist/latexbuild-${VERSION}-linux.tar.gz" "${DIR}/"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  docker-image:
    name: Build and push Docker image
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Hash Docker build context
        id: hash
        run: echo "value=$(find docker -type f -not -path 'docker/editor/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          build-args: |
            LATEXBUILD_VERSION=${{ env.VERSION }}
            LATEXBUILD_DOCKER_HASH=${{ steps.hash.outputs.value }}
          tags: |
            ghcr.io/mrzahmadi/latexbuild:${{ env.VERSION }}
            ghcr.io/mrzahmadi/latexbuild:latest

  release:
    name: Create GitHub Release
    needs: [packages, docker-image]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Remove existing release/tag for this version, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${VERSION}" --yes --cleanup-tag || true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/latexbuild_*.deb
            dist/latexbuild-*.rpm
            dist/latexbuild-*.tar.gz
