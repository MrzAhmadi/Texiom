# Texiom packs: optional extras installed on top of the slim base image.
# Source of truth for `texiom packs|add|remove`; the `full` row also defines the full image.
# Columns (tab-separated): name  group  description  Ubuntu packages (space-separated)
science	Packages	Science and math (siunitx, mhchem, algorithm2e)	texlive-science
publishers	Packages	Publisher classes (IEEEtran, acmart, elsarticle)	texlive-publishers
humanities	Packages	Linguistics and humanities (expex, bibleref)	texlive-humanities
pstricks	Packages	PSTricks graphics packages	texlive-pstricks
metapost	Packages	MetaPost and Metafont packages (feynmp, mfpic)	texlive-metapost
plain-generic	Packages	Plain TeX and generic macros, TeX4ht (htlatex)	texlive-plain-generic
formats-extra	Packages	Additional formats (eplain, xmltex, ...)	texlive-formats-extra
music	Packages	Music typesetting (musixtex)	texlive-music
games	Packages	Chess, Rubik's cube and other game packages	texlive-games
fonts-extra	Fonts	Hundreds of fonts (fontawesome5 icons, kpfonts)	texlive-fonts-extra
extra-utils	Tools	CLI tools: latexdiff, arara, chktex, epstopdf	texlive-extra-utils texlive-font-utils latexdiff chktex lacheck
minted	Tools	Code highlighting for minted (pygments)	python3-pygments
inkscape	Tools	SVG support for \includesvg (inkscape)	inkscape
gnuplot	Tools	Plotting with gnuplot (used by pgfplots)	gnuplot-nox
lang-arabic	Languages	Arabic and Persian (xepersian, bidi)	texlive-lang-arabic
lang-chinese	Languages	Chinese (ctex)	texlive-lang-chinese
lang-cjk	Languages	Chinese/Japanese/Korean base (xeCJK)	texlive-lang-cjk
lang-cyrillic	Languages	Cyrillic	texlive-lang-cyrillic
lang-czechslovak	Languages	Czech and Slovak	texlive-lang-czechslovak
lang-english	Languages	US and UK English	texlive-lang-english
lang-european	Languages	Other European languages	texlive-lang-european
lang-french	Languages	French	texlive-lang-french
lang-german	Languages	German	texlive-lang-german
lang-greek	Languages	Greek	texlive-lang-greek
lang-italian	Languages	Italian	texlive-lang-italian
lang-japanese	Languages	Japanese	texlive-lang-japanese
lang-korean	Languages	Korean	texlive-lang-korean
lang-other	Languages	Other languages (Hebrew, Hindi, Georgian, ...)	texlive-lang-other
lang-polish	Languages	Polish	texlive-lang-polish
lang-portuguese	Languages	Portuguese	texlive-lang-portuguese
lang-spanish	Languages	Spanish	texlive-lang-spanish
