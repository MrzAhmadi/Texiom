<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>latexbuild editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/stex/stex.min.js"></script>
</head>
<body>
<header id="toolbar">
  <div class="toolbar-brand">latexbuild</div>

  <div class="toolbar-group">
    <label class="toggle">
      <input type="checkbox" id="liveToggle" checked>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Live preview</span>
    </label>
    <button id="compileNow" class="btn">Compile now</button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <label class="toggle">
      <input type="checkbox" id="darkToggle">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Dark mode</span>
    </label>
  </div>

  <div class="toolbar-spacer"></div>

  <div id="status" class="ok">ready</div>
</header>
<div id="container">
  <div id="editor-pane"><textarea id="editor"></textarea></div>
  <div id="pdf-pane"><iframe id="pdfFrame" src="/pdf"></iframe></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
