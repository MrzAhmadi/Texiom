<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>latexbuild editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/stex/stex.min.js"></script>
</head>
<body>
<div id="toolbar">
  <label><input type="checkbox" id="liveToggle" checked> Live preview</label>
  <button id="compileNow">Compile now</button>
  <div id="status" class="ok">ready</div>
</div>
<div id="container">
  <div id="editor-pane"><textarea id="editor"></textarea></div>
  <div id="pdf-pane"><iframe id="pdfFrame" src="/pdf"></iframe></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
