name: texiom
arch: all
platform: linux
version: "${TEXIOM_VERSION}"
description: "Compile any .tex file into a PDF using a containerized, full TeX Live distribution - no LaTeX installation required on the host."
maintainer: "Reza <mrzahmadi96@gmail.com>"
license: MIT
homepage: "https://github.com/MrzAhmadi/texiom"

contents:
  - src: ./texiom
    dst: /usr/lib/texiom/texiom
    file_info:
      mode: 0755

  - src: ./docker
    dst: /usr/lib/texiom/docker

  - src: ./VERSION
    dst: /usr/lib/texiom/VERSION

  - src: ./packaging/completions/texiom.bash
    dst: /usr/share/bash-completion/completions/texiom

  - src: /usr/lib/texiom/texiom
    dst: /usr/bin/texiom
    type: symlink
