name: latexbuild
arch: all
platform: linux
version: "${LATEXBUILD_VERSION}"
description: "Compile any .tex file into a PDF using a containerized, full TeX Live distribution - no LaTeX installation required on the host."
maintainer: "Reza <mrzahmadi96@gmail.com>"
license: MIT
homepage: "https://github.com/MrzAhmadi/latexbuild"

contents:
  - src: ./latexbuild
    dst: /usr/lib/latexbuild/latexbuild
    file_info:
      mode: 0755

  - src: ./docker
    dst: /usr/lib/latexbuild/docker

  - src: ./VERSION
    dst: /usr/lib/latexbuild/VERSION

  - src: ./packaging/completions/latexbuild.bash
    dst: /usr/share/bash-completion/completions/latexbuild

  - src: /usr/lib/latexbuild/latexbuild
    dst: /usr/bin/latexbuild
    type: symlink
